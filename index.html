<style>
:root{color-scheme:light;--paper:#f7f6f0;--ink:#263e34;--muted:#6b7b70;--green:#315f4f;--line:#dce3d9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;line-height:1.6}.lock{min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#dce8d9,transparent 64%)}.card{width:min(100%,420px);padding:38px 30px 28px;background:#fffefa;border:1px solid var(--line);border-radius:24px;box-shadow:0 22px 70px #263e3410}.mark{width:64px;height:64px;display:grid;place-items:center;background:#e7eee2;border-radius:50%;font:30px Georgia,serif;color:var(--green);margin:auto}.eyebrow{text-align:center;font-size:10px;letter-spacing:.18em;color:var(--muted);margin:24px 0 8px}h1{text-align:center;font-size:29px;letter-spacing:-.05em;font-weight:600;margin:0}p{text-align:center;font-size:14px;color:var(--muted);margin:12px 0}.brand{font-family:Georgia,serif;font-size:18px}label{font-size:13px;display:block;margin:24px 0 7px}input,button{font:inherit;width:100%;border-radius:10px;padding:13px 14px;min-height:48px}input{border:1px solid var(--line);background:transparent;color:var(--ink);font-size:16px}input:focus-visible{outline:2px solid var(--green);outline-offset:2px}button{margin-top:12px;border:0;background:var(--green);color:white;font-weight:600;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.status{min-height:25px;color:#a1463d;font-size:13px;margin-bottom:0}.note{font-size:12px;margin-top:20px}.foot{text-align:center;font-size:10px;letter-spacing:.1em;margin-top:24px;color:var(--muted)}iframe{width:100%;height:100dvh;height:100svh;border:0;display:block;background:var(--paper)}[hidden]{display:none!important}@media(max-width:360px){.lock{padding:15px}.card{padding:30px 21px}h1{font-size:26px}}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--paper:#19221e;--ink:#e1e9e0;--muted:#afc2b5;--green:#b6d2bd;--line:#3c4e42}.lock{background:radial-gradient(ellipse at 50% 0,#334e3c,transparent 64%)}.card{background:#212e27}.mark{background:#33483a}button{color:#1d2c22}.status{color:#eda49a}}
</style></head><body>
<section class="lock" id="lock-screen"><div class="card"><div class="mark" aria-hidden="true">旅</div><div class="eyebrow">PLACES, PLANS & MEMORIES</div><h1>여행 노트</h1><p>함께 고르고, 차근차근 준비하는<br>우리의 여행 계획.</p><form id="unlock-form"><label for="password">공유받은 비밀번호</label><input id="password" name="password" type="password" inputmode="numeric" autocomplete="off" required placeholder="비밀번호를 입력하세요"><button id="unlock-button" type="submit">여행 계획 열기 →</button><p class="status" id="status" role="status" aria-live="polite"></p></form><p class="note">비밀번호는 기기 안에서만 사용합니다.<br>새로고침하거나 다시 잠그면 다시 입력해야 해요.</p><div class="foot"><span class="brand">旅 · Trip Notes</span></div></div></section>

<script>
(()=>{
 const $=id=>document.getElementById(id),frame=$('viewer'),payload=JSON.parse($('encrypted').textContent);
 const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 let generation=0,opened=false;
 function lock(){
  generation++;opened=false;frame.hidden=true;frame.removeAttribute('srcdoc');frame.src='about:blank';
  $('lock-screen').hidden=false;$('password').value='';$('status').textContent='';$('unlock-button').disabled=false;
  document.title='여행 노트';$('password').focus();
 }
 frame.addEventListener('load',()=>{if(opened){$('lock-screen').hidden=true;frame.hidden=false;document.title='여행 노트 · 여행 목록';}});
 window.addEventListener('message',event=>{if(event.source!==frame.contentWindow)return;if(event.data?.type==='trip-catalog-lock')lock();else if(opened&&event.data?.type==='trip-catalog-open'&&["japan-2027/"].includes(event.data.path))window.location.assign(new URL(event.data.path,window.location.href).href);});
 $('unlock-form').addEventListener('submit',async event=>{
  event.preventDefault();const version=++generation,password=$('password').value;
  $('unlock-button').disabled=true;$('status').textContent='여행 계획을 여는 중…';
  try{
   if(!globalThis.crypto?.subtle||typeof DecompressionStream==='undefined')throw new Error('unsupported');
   const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
   const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64(payload.salt),iterations:payload.iterations},material,{name:'AES-GCM',length:256},false,['decrypt']);
   const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv)},key,b64(payload.cipher));
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   const app=await new Response(stream).text();
   if(version!==generation)return;
   if(!app.startsWith('<!doctype html>'))throw new Error('format');
   $('password').value='';$('status').textContent='';opened=true;frame.removeAttribute('src');frame.srcdoc=app;
  }catch(error){
   if(version!==generation)return;
   opened=false;$('status').textContent=error.message==='unsupported'?'최신 Safari·Chrome에서 HTTPS 링크로 열어 주세요.':'비밀번호를 다시 확인해 주세요.';
   $('password').select();
  }finally{if(version===generation)$('unlock-button').disabled=false;}
 });
})();
</script></body></html>
