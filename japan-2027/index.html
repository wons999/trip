<script>
(()=>{
 const $=id=>document.getElementById(id),frame=$('viewer'),payload=JSON.parse($('encrypted').textContent);
 const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 let generation=0,opened=false;
 function lock(){
  generation++;opened=false;frame.hidden=true;frame.removeAttribute('srcdoc');frame.src='about:blank';
  $('lock-screen').hidden=false;$('password').value='';$('status').textContent='';$('unlock-button').disabled=false;
  document.title='友旅 · 친구들과 여행';$('password').focus();
 }
 frame.addEventListener('load',()=>{if(opened){$('lock-screen').hidden=true;frame.hidden=false;document.title='友旅 · 우리의 여행 계획';}});
 window.addEventListener('message',event=>{if(event.source!==frame.contentWindow)return;if(event.data?.type==='japan-trip-lock')lock();else if(opened&&event.data?.type==='trip-home')window.location.assign(new URL('../',window.location.href).href);});
 $('unlock-form').addEventListener('submit',async event=>{
  event.preventDefault();const version=++generation,password=$('password').value;
  $('unlock-button').disabled=true;$('status').textContent='여행 계획을 여는 중…';
  try{
   if(!globalThis.crypto?.subtle||typeof DecompressionStream==='undefined')throw new Error('unsupported');
   const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
   const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64(payload.salt),iterations:payload.iterations},material,{name:'AES-GCM',length:256},false,['decrypt']);
   const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv)},key,b64(payload.cipher));
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   const app=await new Response(stream).text();
   if(version!==generation)return;
   if(!app.startsWith('<!doctype html>'))throw new Error('format');
   $('password').value='';$('status').textContent='';opened=true;frame.removeAttribute('src');frame.srcdoc=app;
  }catch(error){
   if(version!==generation)return;
   opened=false;$('status').textContent=error.message==='unsupported'?'최신 Safari·Chrome에서 HTTPS 링크로 열어 주세요.':'비밀번호를 다시 확인해 주세요.';
   $('password').select();
  }finally{if(version===generation)$('unlock-button').disabled=false;}
 });
})();
</script></body></html>
